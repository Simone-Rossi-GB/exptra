<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reindirizzamento...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            /* Pagina completamente nascosta - redirect immediato */
        }
    </style>
</head>
<body>
    <script>
        // Get URL parameters from OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const error_description = urlParams.get('error_description');

        console.log('OAuth Callback - Full URL:', window.location.href);
        console.log('OAuth Callback - Parameters:', { code, state, error, error_description });
        console.log('OAuth Callback - User Agent:', navigator.userAgent);

        // Detect if we're on mobile (try deep link) or web (redirect to web app)
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // Redirect IMMEDIATELY without showing any UI
        if (isMobile) {
            console.log('Mobile detected - redirecting immediately via deep link');

            if (error) {
                const deepLink = `exptra://auth/callback?error=${encodeURIComponent(error)}&error_description=${encodeURIComponent(error_description || '')}`;
                console.log('Redirecting to deep link (error):', deepLink);
                window.location.href = deepLink;
            } else if (code) {
                const deepLink = `exptra://auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
                console.log('Redirecting to deep link (success):', deepLink);
                window.location.href = deepLink;
            }
        } else {
            // Web: redirect immediately to React app without showing UI
            console.log('Web detected - redirecting to React app immediately');

            if (code) {
                const webAppUrl = 'http://localhost:5173/oauth-callback';
                const redirectUrl = `${webAppUrl}?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
                console.log('Redirecting to:', redirectUrl);
                window.location.href = redirectUrl;
            } else if (error) {
                console.error('OAuth error:', error, error_description);
                // Redirect to login with error message in URL
                const webAppUrl = 'http://localhost:5173/login';
                const redirectUrl = `${webAppUrl}?oauth_error=${encodeURIComponent(error_description || error)}`;
                console.log('Redirecting to login with error');
                window.location.href = redirectUrl;
            }
        }
    </script>
</body>
</html>
